<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神经</title>
<style>
  :root { color-scheme: light dark;
    --bg:#fff; --fg:#1c1e21; --fg2:#6b7280; --fg3:#9aa1ab; --bd:#e5e7eb; --hov:#f5f6f8; --card:#fff; --act:#f0f1f3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161616; --fg:#e8eaed; --fg2:#a0a4ab; --fg3:#787d86; --bd:#2c2c2c; --hov:#1f1f1f; --card:#1c1c1c; --act:#242424; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--fg); font:14px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .pane { height:100%; display:flex; flex-direction:column; padding:20px 22px 14px; }
  .pane.scroll { overflow:auto; }
  .head h1 { font-size:24px; font-weight:700; letter-spacing:-.3px; margin:0; }
  .head .sub { font-size:13px; color:var(--fg2); margin-top:2px; }
  .grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; margin-top:18px; }
  @media (max-width:640px){ .grid { grid-template-columns:1fr; } }
  .card { display:flex; gap:12px; align-items:flex-start; padding:14px; background:var(--card); border:1px solid var(--bd); border-radius:12px; cursor:pointer; color:inherit; text-align:left; font:inherit; transition:border-color .15s, background .15s; }
  .card:hover { background:var(--hov); }
  .ic { width:48px; height:48px; border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff; flex:none; }
  .ic svg { width:22px; height:22px; }
  .meta { flex:1; min-width:0; }
  .name { font-size:15px; font-weight:600; display:flex; align-items:center; gap:6px; }
  .badge { font-size:11px; font-weight:500; color:var(--fg2); background:var(--act); border-radius:999px; padding:1px 8px; flex:none; }
  .desc { font-size:12px; color:var(--fg2); margin-top:3px; line-height:1.5; }
  .stats { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
  .stats span { background:var(--act); color:var(--fg2); border-radius:999px; padding:2px 8px; font-size:11.5px; }
  .empty { padding:42px 0; text-align:center; color:var(--fg3); font-size:13px; grid-column:1/-1; }
  .foot { margin-top:22px; text-align:center; font-size:12px; color:var(--fg3); flex:none; }
  .ghead { display:flex; align-items:center; gap:10px; flex:none; margin-bottom:12px; }
  .back { flex:none; padding:6px 14px; border-radius:999px; font-size:13px; background:var(--act); color:var(--fg2); border:0; cursor:pointer; font:inherit; }
  .back:hover { background:var(--hov); color:var(--fg); }
  .title { font-size:16px; font-weight:700; }
  .chip { background:var(--act); color:var(--fg2); border-radius:999px; padding:2px 9px; font-size:11.5px; }
  .legend { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:12px; color:var(--fg2); }
  .legend i { display:inline-block; border-radius:50%; }
  .lg-mem { width:8px; height:8px; background:#9aa7b8; }
  .lg-cog { width:12px; height:12px; background:#5b8ff9; }
  .lg-comm { width:15px; height:15px; background:#7b6bd6; }
  @media (max-width:720px){ .legend { display:none; } }
  .graph { position:relative; flex:1; min-height:0; background:var(--card); border:1px solid var(--bd); border-radius:12px; overflow:hidden; }
  canvas { position:absolute; inset:0; touch-action:none; cursor:grab; }
  canvas:active { cursor:grabbing; }
  .hint { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--fg2); font-size:13px; text-align:center; padding:0 20px; }
  .note { position:absolute; top:10px; left:10px; right:10px; z-index:3; pointer-events:none; background:var(--act); color:var(--fg2); border:1px solid var(--bd); border-radius:8px; padding:6px 10px; font-size:12px; line-height:1.5; }
  .pop { position:absolute; z-index:6; width:300px; background:var(--bg); border:1px solid var(--bd); border-radius:12px; box-shadow:0 10px 32px rgba(20,30,60,.16); padding:11px 12px 10px; font-size:12.5px; pointer-events:none; }
  .pop-h { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600; }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .chips span { background:var(--act); color:var(--fg2); border-radius:999px; padding:2px 8px; font-size:11.5px; }
  .members { pointer-events:auto; margin-top:9px; border-top:1px solid var(--bd); padding-top:8px; max-height:190px; overflow:auto; display:flex; flex-direction:column; gap:5px; }
  .mrow { display:flex; align-items:center; gap:6px; }
  .role { width:8px; height:8px; border-radius:50%; flex:none; background:var(--hue, #8a94a6); }
  .role.context { background:transparent; border:1.5px solid var(--hue, #8a94a6); }
  .mq { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .score { flex:none; font-size:11px; color:var(--fg3); font-variant-numeric:tabular-nums; }
  .q { margin-top:8px; line-height:1.5; max-height:90px; overflow:auto; overflow-wrap:anywhere; }
  .kws { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .kw { border:1px solid var(--bd); border-radius:999px; padding:1px 8px; font-size:11px; color:var(--fg2); }
  .prev { margin-top:8px; color:var(--fg2); line-height:1.55; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }
</style>
</head>
<body>
  <div class="pane scroll" id="picker">
    <div class="head">
      <h1>神经元</h1>
      <div class="sub">记忆神经元库 · mem→认知→社群三级节点图（数据源 .claude/neturon/neurons）</div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="foot">数据源：网关 /gateway/neurons 实时扫描</div>
  </div>
  <div class="pane" id="view" hidden>
    <div class="ghead">
      <button class="back" id="back">‹ 神经元</button>
      <span class="title" id="vtitle"></span>
      <span id="vchips" style="display:flex;gap:6px"></span>
      <span class="legend"><i class="lg-mem"></i>记忆<i class="lg-cog"></i>认知<i class="lg-comm"></i>社群</span>
    </div>
    <div class="graph" id="graph"><canvas id="canvas"></canvas><div class="pop" id="pop" hidden></div></div>
    <div class="foot">滚轮缩放 · 空白处拖拽平移 · 节点可拖拽 · 悬停/点击弹浮窗 · 数据源 /gateway/neurons/graph</div>
  </div>
<script>
  const TOKEN = new URLSearchParams(location.search).get('token') || ''
  const PALETTE = ['#5b8ff9', '#61a1c2', '#7b6bd6', '#5aa57a', '#d98a4a', '#c96a6a', '#4aa3a0', '#a06ba8', '#6b8f71', '#b48a5a']
  const BRAIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4.5a2.5 2.5 0 0 0-2.5 2.5 2.5 2.5 0 0 0-1.8 4.2A2.6 2.6 0 0 0 6 15.6 2.5 2.5 0 0 0 8.5 18h1V4.5z"/><path d="M14.5 4.5A2.5 2.5 0 0 1 17 7a2.5 2.5 0 0 1 1.8 4.2 2.6 2.6 0 0 1-.8 4.4A2.5 2.5 0 0 1 15.5 18h-1V4.5z"/><path d="M12 4.5v13.5M12 18v1.5"/></svg>'
  function api(p) { return p + (TOKEN ? (p.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN) : '') }
  function color(n) { let h = 0; for (const c of String(n)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length] }
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  function $(id) { return document.getElementById(id) }

  // ---------- 层级1：库选择 ----------
  let NEU = [], NEU_ERR = ''
  async function loadList() {
    try {
      const r = await fetch(api('/gateway/neurons'))
      if (!r.ok) throw new Error('HTTP ' + r.status)
      const d = await r.json()
      NEU = Array.isArray(d.neurons) ? d.neurons : []
      renderGrid()
    } catch (e) {
      NEU_ERR = e.message || String(e)
      renderGrid()
    }
  }
  function renderGrid() {
    const g = $('grid')
    if (NEU_ERR) { g.innerHTML = '<div class="empty">清单加载失败：' + esc(NEU_ERR) + '</div>'; return }
    g.innerHTML = NEU.length
      ? NEU.map(cardHtml).join('')
      : '<div class="empty">未发现神经元库（各根 .claude/neturon/neurons/ 下含 config.yaml + l2.mem/mem.db 的目录即注册）</div>'
    g.querySelectorAll('.card').forEach((c) => c.addEventListener('click', () => openGraph(c.dataset.id)))
  }
  function cardHtml(n) {
    return '<button class="card" data-id="' + esc(n.id) + '" title="进入 ' + esc(n.name || n.id) + ' 节点图">' +
      '<span class="ic" style="background:' + color(n.id) + '">' + BRAIN + '</span>' +
      '<span class="meta"><span class="name">' + esc(n.name || n.id) + '<span class="badge">' + esc(n.id) + '</span></span>' +
      '<span class="desc">' + esc(n.description || '（无触发说明）') + '</span>' +
      '<span class="stats"><span>记忆 ' + n.mem_count + '</span><span>认知 ' + n.cog_count + '</span><span>社群 ' + n.community_count + '</span>' +
      (n.last_updated ? '<span>更新 ' + esc(String(n.last_updated).slice(0, 10)) + '</span>' : '') + '</span></span></button>'
  }

  // ---------- 层级2：图 ----------
  let VIEW = null
  async function openGraph(id) {
    $('picker').hidden = true
    $('view').hidden = false
    const meta = NEU.find((n) => n.id === id)
    $('vtitle').textContent = (meta && (meta.name || meta.id)) || id
    $('vchips').innerHTML = meta
      ? '<span class="chip">记忆 ' + meta.mem_count + '</span><span class="chip">认知 ' + meta.cog_count + '</span><span class="chip">社群 ' + meta.community_count + '</span>'
      : ''
    if (VIEW) { if (VIEW.ro) VIEW.ro.disconnect(); if (VIEW.raf) cancelAnimationFrame(VIEW.raf); VIEW = null }
    const box = $('graph')
    box.innerHTML = '<canvas id="canvas"></canvas><div class="pop" id="pop" hidden></div>'
    box.insertAdjacentHTML('afterbegin', '<div class="hint">加载图数据…</div>')
    try {
      const r = await fetch(api('/gateway/neurons/graph?id=' + encodeURIComponent(id)))
      const d = await r.json()
      if (!r.ok || !d || !d.neuron || !Array.isArray(d.cogs)) throw new Error(d.error || ('HTTP ' + r.status))
      const hint = box.querySelector('.hint'); if (hint) hint.remove()
      startGraph(d)
    } catch (e) {
      const hint = box.querySelector('.hint')
      if (hint) hint.textContent = '图数据加载失败：' + (e.message || e)
    }
  }
  $('back').addEventListener('click', () => {
    if (VIEW) { if (VIEW.ro) VIEW.ro.disconnect(); if (VIEW.raf) cancelAnimationFrame(VIEW.raf); VIEW = null }
    $('view').hidden = true
    $('picker').hidden = false
  })

  // 半径：mem 小点；cog ∝ 挂载数 + 内容量；社群 ∝ cog 数 + 内容量
  function memR(chars) { return 2.5 + Math.min(2.5, chars / 600) }
  function cogR(nMems, chars) { return Math.min(24, 7 + 2.4 * Math.sqrt(nMems) + Math.min(7, chars / 1200)) }
  function commR(nCogs, chars) { return Math.min(34, 11 + 3.2 * Math.sqrt(nCogs * 2) + Math.min(9, chars / 2500)) }
  function hue(i) { return PALETTE[i % PALETTE.length] }

  function buildModel(d) {
    const nodes = [], links = [], idxOf = {}
    const C = d.communities
    for (let i = 0; i < C.length; i++) {
      const c = C[i]
      const ang = (2 * Math.PI * i) / Math.max(1, C.length) - Math.PI / 2
      idxOf['c' + c.i] = nodes.length
      nodes.push({ key: 'comm' + c.i, type: 'comm', r: commR(c.size, c.chars), ref: c, x: Math.cos(ang) * 170, y: Math.sin(ang) * 170, vx: 0, vy: 0 })
    }
    for (const g of d.cogs) {
      idxOf['g' + g.id] = nodes.length
      const comm = g.community >= 0 ? C[g.community] : null
      const host = comm ? idxOf['c' + comm.i] : -1
      const k = nodes.length, ang = 0.7 * k
      const rad = host >= 0 ? nodes[host].r + 60 + (k % 7) * 9 : 300
      const cx = host >= 0 ? nodes[host].x : 0, cy = host >= 0 ? nodes[host].y : 0
      nodes.push({ key: 'cog' + g.id, type: 'cog', r: cogR(g.mem_ids.length + g.rel_ids.length, g.chars), ref: g, x: cx + Math.cos(ang) * rad, y: cy + Math.sin(ang) * rad, vx: 0, vy: 0 })
    }
    for (const m of d.mems) {
      idxOf['m' + m.id] = nodes.length
      const hostCog = d.cogs.find((g) => g.mem_ids.includes(m.id) || g.rel_ids.includes(m.id))
      const host = hostCog ? idxOf['g' + hostCog.id] : -1
      const k = nodes.length, ang = 1.3 * k
      const rad = host >= 0 ? nodes[host].r + 10 + (k % 5) * 5 : 120 + (k % 9) * 8
      const cx = host >= 0 ? nodes[host].x : 0, cy = host >= 0 ? nodes[host].y : 0
      nodes.push({ key: 'mem' + m.id, type: 'mem', r: memR(m.chars), ref: m, x: cx + Math.cos(ang) * rad, y: cy + Math.sin(ang) * rad, vx: 0, vy: 0 })
    }
    for (const g of d.cogs) {
      const gi = idxOf['g' + g.id]
      if (g.community >= 0 && idxOf['c' + g.community] !== undefined) links.push({ s: idxOf['c' + g.community], t: gi, kind: 'comm' })
      for (const mid of g.mem_ids) { const mi = idxOf['m' + mid]; if (mi !== undefined) links.push({ s: gi, t: mi, kind: 'mem' }) }
      for (const mid of g.rel_ids) { const mi = idxOf['m' + mid]; if (mi !== undefined) links.push({ s: gi, t: mi, kind: 'rel' }) }
    }
    return { nodes, links, neuron: d.neuron }
  }

  const CHARGE = { mem: 12, cog: 72, comm: 360 }
  const PAD = { mem: 6, rel: 6, comm: 16 }
  const KLINK = { mem: 0.06, rel: 0.04, comm: 0.09 }
  const G = 0.01
  function tick(model, alpha) {
    const ns = model.nodes
    for (let i = 0; i < ns.length; i++) {
      const a = ns[i]
      for (let j = i + 1; j < ns.length; j++) {
        const b = ns[j]
        let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy
        if (d2 < 1) { dx = (i % 3) - 1 || 0.5; dy = (j % 3) - 1 || 0.5; d2 = 1 }
        const f = (CHARGE[a.type] * CHARGE[b.type] * alpha) / d2
        const d = Math.sqrt(d2), fx = (dx / d) * f, fy = (dy / d) * f
        a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy
      }
    }
    for (const lk of model.links) {
      const a = ns[lk.s], b = ns[lk.t]
      const dx = b.x - a.x, dy = b.y - a.y
      const d = Math.sqrt(dx * dx + dy * dy) || 1
      const L = a.r + b.r + PAD[lk.kind]
      const f = (d - L) * KLINK[lk.kind] * alpha
      const fx = (dx / d) * f, fy = (dy / d) * f
      a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy
    }
    for (const n of ns) {
      n.vx += (0 - n.x) * G * alpha
      n.vy += (0 - n.y) * G * alpha
      n.vx *= 0.85; n.vy *= 0.85
      const sp = Math.sqrt(n.vx * n.vx + n.vy * n.vy)
      const cap = 14 * Math.min(1, alpha / 0.3)
      if (sp > cap) { n.vx = (n.vx / sp) * cap; n.vy = (n.vy / sp) * cap }
      if (!n.fixed) { n.x += n.vx; n.y += n.vy } else { n.vx = 0; n.vy = 0 }
    }
    for (let i = 0; i < ns.length; i++) {
      const a = ns[i]
      for (let j = i + 1; j < ns.length; j++) {
        const b = ns[j]
        const dx = b.x - a.x, dy = b.y - a.y
        const min = a.r + b.r + 1.5
        const d2 = dx * dx + dy * dy
        if (d2 >= min * min || d2 === 0) continue
        const d = Math.sqrt(d2), push = ((min - d) / d) * 0.5
        const fx = dx * push, fy = dy * push
        if (!a.fixed) { a.x -= fx; a.y -= fy }
        if (!b.fixed) { b.x += fx; b.y += fy }
      }
    }
  }

  function palette() {
    const dark = matchMedia('(prefers-color-scheme: dark)').matches
    return dark
      ? { ringCog: 'rgba(22,22,22,0.9)', ringComm: 'rgba(22,22,22,0.95)', label: 'rgba(208,212,220,0.85)' }
      : { ringCog: 'rgba(255,255,255,0.9)', ringComm: 'rgba(255,255,255,0.95)', label: 'rgba(40,50,70,0.85)' }
  }
  function cogHue(n) { return n.type === 'comm' ? hue(n.ref.i) : n.ref.community >= 0 ? hue(n.ref.community) : '#8a94a6' }
  function hexA(hex, a) { const h = hex.replace('#', ''); return 'rgba(' + parseInt(h.slice(0, 2), 16) + ',' + parseInt(h.slice(2, 4), 16) + ',' + parseInt(h.slice(4, 6), 16) + ',' + a + ')' }

  function startGraph(data) {
    const canvas = $('canvas'), box = $('graph'), pop = $('pop')
    const model = buildModel(data)
    const st = { model, view: { x: 0, y: 0, k: 1 }, raf: 0, pinned: null, canvas, ctx: canvas.getContext('2d'), box, pop, alpha: 1, drag: null }
    VIEW = st
    const resize = () => {
      const w = box.clientWidth, h = box.clientHeight
      if (!w || !h) return
      const dpr = window.devicePixelRatio || 1
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr)
      canvas.style.width = w + 'px'; canvas.style.height = h + 'px'
      st.ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      st.w = w; st.h = h
      st.alpha = Math.max(st.alpha, 0.3)
    }
    resize()
    st.ro = new ResizeObserver(resize); st.ro.observe(box)
    const frame = () => {
      if (!canvas.isConnected) { if (st.ro) st.ro.disconnect(); if (st.raf) cancelAnimationFrame(st.raf); if (VIEW === st) VIEW = null; return }
      if (st.alpha > 0.003) { tick(st.model, st.alpha); st.alpha *= 0.985 }
      draw(st)
      if (st.pinned) positionPop(st)
      st.raf = requestAnimationFrame(frame)
    }
    st.raf = requestAnimationFrame(frame)
    bindPointer(st)
    const cog = data.cognition || {}
    if (!cog.graph || !cog.communities) {
      const note = document.createElement('div')
      note.className = 'note'
      note.textContent = !cog.graph
        ? '该库尚无认知图（未跑认知管线 recall → fill_precog → build_graph），当前仅呈现记忆层 ' + data.mems.length + ' 条'
        : '该库尚未检测社群（未跑 detect_communities），认知节点暂未归群'
      box.appendChild(note)
    }
  }

  function toGraph(st, sx, sy) { return { x: (sx - st.w / 2 - st.view.x) / st.view.k, y: (sy - st.h / 2 - st.view.y) / st.view.k } }
  function hit(st, cx, cy) {
    const rect = st.box.getBoundingClientRect()
    const p = toGraph(st, cx - rect.left, cy - rect.top)
    let best = null
    for (const n of st.model.nodes) {
      const d = Math.sqrt((n.x - p.x) ** 2 + (n.y - p.y) ** 2)
      const lim = n.type === 'mem' ? n.r + 4 : n.r + 2
      if (d <= lim && (!best || n.r > best.r)) best = n
    }
    return best
  }
  function draw(st) {
    const { ctx, model, view } = st
    const w = st.w || 0, h = st.h || 0, pal = palette()
    ctx.clearRect(0, 0, w, h)
    ctx.save()
    ctx.translate(w / 2 + view.x, h / 2 + view.y)
    ctx.scale(view.k, view.k)
    for (const lk of model.links) {
      const a = model.nodes[lk.s], b = model.nodes[lk.t]
      const hu = a.type === 'comm' ? hue(a.ref.i) : cogHue(a)
      ctx.strokeStyle = lk.kind === 'comm' ? hexA(hu, 0.4) : lk.kind === 'rel' ? hexA(hu, 0.1) : hexA(hu, 0.22)
      ctx.lineWidth = lk.kind === 'comm' ? 1.6 : lk.kind === 'rel' ? 0.6 : 1
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke()
    }
    for (const n of model.nodes) {
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2)
      if (n.type === 'mem') ctx.fillStyle = '#9aa7b8'
      else if (n.type === 'cog') { ctx.fillStyle = cogHue(n); ctx.strokeStyle = pal.ringCog; ctx.lineWidth = 1.2; ctx.stroke() }
      else { ctx.fillStyle = cogHue(n); ctx.strokeStyle = pal.ringComm; ctx.lineWidth = 2; ctx.stroke() }
      ctx.fill()
      if (n.type === 'comm') {
        ctx.fillStyle = pal.label; ctx.font = '10px system-ui, sans-serif'; ctx.textAlign = 'center'
        ctx.fillText((n.ref.name || '群' + (n.ref.i + 1)) + '·' + n.ref.size, n.x, n.y + n.r + 12)
      }
    }
    ctx.restore()
  }

  function bindPointer(st) {
    const cv = st.canvas
    let moved = 0
    cv.addEventListener('pointerdown', (e) => {
      cv.setPointerCapture(e.pointerId); moved = 0
      const h = hit(st, e.clientX, e.clientY)
      st.drag = { hit: h, sx: e.clientX, sy: e.clientY, vx: st.view.x, vy: st.view.y }
      if (h) h.fixed = true
    })
    cv.addEventListener('pointermove', (e) => {
      if (st.drag) {
        const dx = e.clientX - st.drag.sx, dy = e.clientY - st.drag.sy
        moved = Math.max(moved, Math.abs(dx) + Math.abs(dy))
        if (st.drag.hit) {
          const rect = st.box.getBoundingClientRect()
          const p = toGraph(st, e.clientX - rect.left, e.clientY - rect.top)
          st.drag.hit.x = p.x; st.drag.hit.y = p.y; st.alpha = Math.max(st.alpha, 0.35)
        } else { st.view.x = st.drag.vx + dx; st.view.y = st.drag.vy + dy }
        return
      }
      const h = hit(st, e.clientX, e.clientY)
      if (h) showPop(st, h, e.clientX, e.clientY)
      else if (!st.pinned) hidePop(st)
    })
    const up = (e) => {
      if (st.drag) {
        if (st.drag.hit) {
          st.drag.hit.fixed = false
          if (moved < 5) {
            st.pinned = st.pinned === st.drag.hit ? null : st.drag.hit
            if (st.pinned) showPop(st, st.pinned, e.clientX, e.clientY); else hidePop(st)
          }
        } else if (moved < 5) { st.pinned = null; hidePop(st) }
      }
      st.drag = null
    }
    cv.addEventListener('pointerup', up)
    cv.addEventListener('pointercancel', () => { st.drag = null })
    cv.addEventListener('wheel', (e) => {
      e.preventDefault()
      st.view.k = Math.min(3, Math.max(0.25, st.view.k * Math.exp(-e.deltaY * 0.0012)))
    }, { passive: false })
    cv.addEventListener('pointerleave', () => { if (!st.pinned) hidePop(st) })
  }

  function showPop(st, node, cx, cy) { st.hover = node; st.pop.innerHTML = popHtml(node); st.pop.hidden = false; st.popAt = { x: cx, y: cy }; positionPop(st) }
  function positionPop(st) {
    const node = st.pinned || st.hover, pop = st.pop
    if (!node || pop.hidden) return
    let sx, sy
    if (st.pinned === node) {
      const rect = st.box.getBoundingClientRect()
      sx = rect.left + st.w / 2 + st.view.x + node.x * st.view.k
      sy = rect.top + st.h / 2 + st.view.y + node.y * st.view.k
    } else if (st.popAt) { sx = st.popAt.x; sy = st.popAt.y } else return
    const pw = pop.offsetWidth || 300, ph = pop.offsetHeight || 160, rect = st.box.getBoundingClientRect()
    let left = sx - rect.left + 14, top = sy - rect.top + 14
    left = Math.max(6, Math.min(left, rect.width - pw - 6))
    top = Math.max(6, Math.min(top, rect.height - ph - 6))
    pop.style.left = left + 'px'; pop.style.top = top + 'px'
  }
  function hidePop(st) { st.hover = null; st.pop.hidden = true }
  function chips(arr) { return '<div class="chips">' + arr.filter(Boolean).map((x) => '<span>' + x + '</span>').join('') + '</div>' }
  function fmtChars(n) { return n >= 1000 ? (n / 1000).toFixed(1) + 'k 字' : n + ' 字' }
  function popHtml(node) {
    if (node.type === 'comm') {
      const c = node.ref, hu = hue(c.i)
      const rows = c.members.map((m) =>
        '<div class="mrow"><span class="role ' + esc(m.role) + '" style="--hue:' + hu + '"></span>' +
        '<span class="mq" title="' + esc(m.query) + '">' + esc(m.query) + '</span>' +
        '<span class="score">' + Number(m.core_score).toFixed(2) + '</span></div>').join('')
      return '<div class="pop-h"><span class="dot" style="background:' + hu + '"></span>' +
        (c.name ? esc(c.name) + ' · 认知 ' + c.size : '群 ' + (c.i + 1) + ' · 认知 ' + c.size) + '</div>' +
        (c.description ? '<div class="q">' + esc(c.description) + '</div>' : '') +
        chips(['记忆 ' + c.mem_count, '密度 ' + Number(c.density).toFixed(2), '内容 ' + fmtChars(c.chars)]) +
        '<div class="members">' + (rows || '<div>（无成员）</div>') + '</div>'
    }
    if (node.type === 'cog') {
      const g = node.ref, hu = g.community >= 0 ? hue(g.community) : '#8a94a6'
      const kws = g.keywords.slice(0, 6).map((k) => '<span class="kw">' + esc(k) + '</span>').join('')
      return '<div class="pop-h"><span class="dot" style="background:' + hu + '"></span>认知节点' + (g.community >= 0 ? ' · 群 ' + (g.community + 1) : ' · 游离') + '</div>' +
        '<div class="q">' + esc(g.query) + '</div>' + (kws ? '<div class="kws">' + kws + '</div>' : '') +
        chips(['记忆 ' + g.mem_ids.length, g.rel_ids.length ? '关联 ' + g.rel_ids.length : '', '内容 ' + fmtChars(g.chars)])
    }
    const m = node.ref
    return '<div class="pop-h"><span class="dot" style="background:#9aa7b8"></span>记忆' + (m.time ? ' · ' + esc(m.time) : '') + '</div>' +
      '<div class="prev">' + esc(m.preview || '（无文本）') + '</div>' +
      chips(['内容 ' + fmtChars(m.chars), m.source ? '来源 ' + esc(m.source) : ''])
  }

  loadList()
</script>
</body>
</html>
